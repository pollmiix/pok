<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia para celular | Walk Cards</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: #ececf1; font-family: Arial, sans-serif; }
    .phone { width: 390px; height: min(844px, calc(100vh - 48px)); min-height: 560px; overflow: hidden; border: 8px solid #17191d; border-radius: 34px; background: #fff; box-shadow: 0 18px 55px #17132b30; }
    .phone iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    @media (max-width: 500px) {
      body { display: block; min-height: 100dvh; padding: 0; background: #fff; }
      .phone { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Prévia do site no celular">
    <iframe src="./index.html" title="Loja Walk Cards em formato de celular"></iframe>
  </main>
</body>
</html>
